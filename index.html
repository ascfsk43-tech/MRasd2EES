<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr.Ahmed | Bio Link</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Tajawal:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Space Grotesk', 'Tajawal', sans-serif;
            background-color: #000000;
            color: #ffffff;
            overflow-x: hidden;
            user-select: none;
        }

        /* Dark animated/sunburst backdrop style based on custom wallpaper */
        .bg-custom {
            background-image: radial-gradient(circle at center, rgba(30, 30, 30, 0.85) 0%, rgba(5, 5, 5, 0.98) 100%), 
                              url('https://cdn.discordapp.com/attachments/1560688996969873680/1561058045377646732/Screenshot_2026-10-17_204712.png?ex=6ad4f819&is=6ad3a699&hm=9296ee64909f435bba8021ccf420642386f8a3f7c49f0328c3b2ef2b4a90fd17&');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Minimalistic Glass Card matching reference style */
        .glass-card-minimal {
            background: rgba(220, 220, 225, 0.65);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
            color: #111111;
        }

        /* Audio Controls Top Left Button */
        .audio-top-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .audio-top-btn:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(1.08);
        }

        /* Playlist Drawer Modal */
        .playlist-modal {
            background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Social Icon buttons inside card */
        .social-icon-btn {
            transition: all 0.25s ease;
            color: #1a1a1a;
        }

        .social-icon-btn:hover {
            transform: translateY(-3px) scale(1.15);
            color: #000000;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        /* Particle Canvas Overlay */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Custom Scrollbar for Song Picker */
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-custom min-h-screen flex items-center justify-center p-4 relative cursor-pointer" onclick="enableAudioOnUserInteraction()">

    <canvas id="particles-canvas"></canvas>

    <!-- YouTube Background Audio Player (Hidden) -->
    <div id="iframe-wrapper" class="fixed -top-96 -left-96 opacity-0 pointer-events-none w-1 h-1 overflow-hidden">
        <div id="youtube-player"></div>
    </div>

    <!-- Top Left Controls -->
    <div class="fixed top-5 left-5 z-50 flex items-center gap-2">
        <button id="music-btn" onclick="toggleAudio(event)" title="تشغيل / إيقاف الصوت" class="audio-top-btn w-11 h-11 rounded-xl flex items-center justify-center shadow-lg group">
            <i id="music-icon" class="fa-solid fa-volume-xmark text-lg group-hover:scale-110 transition-transform"></i>
        </button>
        <button id="playlist-btn" onclick="togglePlaylistMenu(event)" title="قائمة الأغاني" class="audio-top-btn w-11 h-11 rounded-xl flex items-center justify-center shadow-lg group">
            <i class="fa-solid fa-list-music text-lg group-hover:scale-110 transition-transform"></i>
        </button>
    </div>

    <!-- Playlist Menu Drawer -->
    <div id="playlist-menu" class="hidden fixed top-20 left-5 z-50 w-80 playlist-modal rounded-2xl p-4 text-white shadow-2xl transition-all duration-300" onclick="event.stopPropagation()">
        <div class="flex items-center justify-between pb-3 border-b border-white/10 mb-3">
            <div class="flex items-center gap-2 font-bold text-sm">
                <i class="fa-solid fa-compact-disc text-yellow-400 animate-spin" style="animation-duration: 8s;"></i>
                <span>اختر الأغنية 🎵</span>
            </div>
            <button onclick="togglePlaylistMenu(event)" class="text-gray-400 hover:text-white text-xs">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Song List Container (Populated via JS) -->
        <div class="space-y-2 max-h-64 overflow-y-auto custom-scroll pr-1" id="song-list-container">
        </div>
    </div>

    <!-- Audio Autoplay Banner Hint -->
    <div id="audio-hint" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 bg-black/70 border border-white/20 backdrop-blur-md px-5 py-2 rounded-full text-xs text-white flex items-center gap-2 shadow-2xl animate-bounce">
        <i class="fa-solid fa-music text-yellow-400"></i>
        <span>اضغط في أي مكان لتشغيل الموسيقى 🎵</span>
    </div>

    <main class="glass-card-minimal relative z-10 w-full max-w-sm rounded-3xl p-8 text-center my-auto transition-all duration-500 shadow-2xl">
        
        <!-- Profile Avatar -->
        <div class="relative inline-block mb-4">
            <div class="w-24 h-24 rounded-full mx-auto overflow-hidden bg-black/10 border-2 border-white/40 shadow-xl flex items-center justify-center">
                <img src="https://cdn.discordapp.com/attachments/1560688996969873680/1561057814674149407/Screenshot_2026-10-17_204605.png?ex=6ad4f7e2&is=6ad3a662&hm=33357c3fb11e70df12b3a5d91fd7f3feef9864b652b150e66fb0c1df53e2cdc0&" 
                     alt="Mr.Ahmed Profile" 
                     class="w-full h-full object-cover">
            </div>
        </div>

        <!-- Name Title -->
        <h1 class="font-bold text-2xl tracking-wider text-black mb-1">
            Mr.Ahmed.
        </h1>

        <!-- Currently Playing Song Display Tag -->
        <div id="current-song-display" class="text-[11px] font-semibold text-gray-700 mb-3 flex items-center justify-center gap-1.5 opacity-90">
            <i class="fa-solid fa-music text-yellow-600 animate-pulse"></i>
            <span id="current-song-title">جاري تحميل الأغنية...</span>
        </div>

        <!-- Status Pill -->
        <div class="bg-white/40 border border-white/50 rounded-2xl p-3 mb-6 backdrop-blur-sm text-xs font-semibold text-gray-800 flex items-center justify-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>بث مباشر و ألعاب | Streamer</span>
        </div>

        <!-- Social Links Container -->
        <div class="flex items-center justify-center gap-6 my-4 py-2">
            <!-- Discord -->
            <a href="https://discord.gg/DzEfWjhDjm" target="_blank" title="Discord" class="social-icon-btn flex flex-col items-center gap-1 text-2xl group">
                <i class="fa-brands fa-discord"></i>
                <span class="text-[10px] font-bold tracking-wider uppercase opacity-75 group-hover:opacity-100">Discord</span>
            </a>

            <!-- Kick -->
            <a href="https://kick.com/Shsjsjqiiweuueieieiei" target="_blank" title="Kick Stream" class="social-icon-btn flex flex-col items-center gap-1 text-2xl group">
                <i class="fa-solid fa-bolt"></i>
                <span class="text-[10px] font-bold tracking-wider uppercase opacity-75 group-hover:opacity-100">Kick</span>
            </a>

            <!-- YouTube -->
            <a href="https://www.youtube.com/@rfr811" target="_blank" title="YouTube Channel" class="social-icon-btn flex flex-col items-center gap-1 text-2xl group">
                <i class="fa-brands fa-youtube"></i>
                <span class="text-[10px] font-bold tracking-wider uppercase opacity-75 group-hover:opacity-100">YouTube</span>
            </a>
        </div>

        <!-- Card Footer Info -->
        <div class="mt-6 pt-3 flex items-center justify-between text-[11px] font-medium text-gray-700/80 border-t border-black/10">
            <div class="flex items-center gap-1.5">
                <i class="fa-regular fa-eye"></i>
                <span id="views-count">1,248</span>
            </div>
            <span>© Mr.Ahmed</span>
        </div>
    </main>

    <script>
        // Updated Songs Configuration Array - Only Song 2 and 3
        const songsList = [
            { id: '2TLBpRI9yw4', title: 'الأغنية الأولى (2)' },
            { id: 'hKF3LHr45EQ', title: 'الأغنية الثانية (3)' }
        ];

        let currentSongIndex = 0;
        let player = null;
        let isMuted = true;
        let isPlayerReady = false;

        // Load YouTube IFrame API
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                videoId: songsList[currentSongIndex].id,
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'loop': 1,
                    'playlist': songsList[currentSongIndex].id,
                    'playsinline': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            isPlayerReady = true;
            updateCurrentSongUI();
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                playNextSong();
            }
        }

        function enableAudioOnUserInteraction() {
            if (isMuted && isPlayerReady && player) {
                player.unMute();
                player.playVideo();
                isMuted = false;
                updateAudioUI();
                const hint = document.getElementById('audio-hint');
                if (hint) hint.classList.add('hidden');
            }
        }

        function toggleAudio(e) {
            if (e) e.stopPropagation();
            if (!isPlayerReady || !player) return;

            if (isMuted) {
                player.unMute();
                player.playVideo();
                isMuted = false;
            } else {
                player.mute();
                isMuted = true;
            }
            updateAudioUI();
        }

        function updateAudioUI() {
            const icon = document.getElementById('music-icon');
            const hint = document.getElementById('audio-hint');

            if (!isMuted) {
                icon.className = "fa-solid fa-volume-high text-lg group-hover:scale-110 transition-transform text-yellow-400";
                if (hint) hint.classList.add('hidden');
            } else {
                icon.className = "fa-solid fa-volume-xmark text-lg group-hover:scale-110 transition-transform text-gray-300";
            }
        }

        function togglePlaylistMenu(e) {
            if (e) e.stopPropagation();
            const menu = document.getElementById('playlist-menu');
            menu.classList.toggle('hidden');
        }

        function selectSong(index) {
            currentSongIndex = index;
            if (player && isPlayerReady) {
                player.loadVideoById(songsList[currentSongIndex].id);
                player.unMute();
                isMuted = false;
                updateAudioUI();
            }
            updateCurrentSongUI();
            renderSongList();
        }

        function playNextSong() {
            currentSongIndex = (currentSongIndex + 1) % songsList.length;
            selectSong(currentSongIndex);
        }

        function updateCurrentSongUI() {
            const songTitleEl = document.getElementById('current-song-title');
            if (songTitleEl && songsList[currentSongIndex]) {
                songTitleEl.textContent = songsList[currentSongIndex].title;
            }
        }

        function renderSongList() {
            const container = document.getElementById('song-list-container');
            if (!container) return;
            container.innerHTML = '';

            songsList.forEach((song, idx) => {
                const isActive = idx === currentSongIndex;
                const item = document.createElement('div');
                item.className = `p-2.5 rounded-xl cursor-pointer flex items-center justify-between text-xs transition-all ${
                    isActive 
                        ? 'bg-yellow-500/20 text-yellow-300 border border-yellow-500/30 font-bold' 
                        : 'bg-white/5 text-gray-300 hover:bg-white/10'
                }`;
                item.onclick = (e) => {
                    e.stopPropagation();
                    selectSong(idx);
                };

                item.innerHTML = `
                    <div class="flex items-center gap-2 truncate">
                        <i class="fa-solid ${isActive ? 'fa-circle-play text-yellow-400' : 'fa-music text-gray-400'} text-sm"></i>
                        <span class="truncate">${song.title}</span>
                    </div>
                    ${isActive ? '<span class="text-[10px] bg-yellow-400/20 px-2 py-0.5 rounded-full text-yellow-300">يشتغل الان</span>' : ''}
                `;
                container.appendChild(item);
            });
        }

        // Initialize Song List on Load
        window.addEventListener('DOMContentLoaded', () => {
            renderSongList();
            updateCurrentSongUI();
        });

        // Canvas Particles Background
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = Array.from({ length: 35 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 0.5,
            speedX: (Math.random() - 0.5) * 0.4,
            speedY: (Math.random() - 0.5) * 0.4,
            opacity: Math.random() * 0.5 + 0.1
        }));

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;

                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;

                ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
